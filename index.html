<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sova-frontend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--color-bg-accent, #b7abbd);
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }

      .preloader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .preloader-logo {
        width: 247px;
        height: 163px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="preloader" class="preloader">
      <img class="preloader-logo" src="/logo.svg" alt="Логотип журнала SOVA" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
